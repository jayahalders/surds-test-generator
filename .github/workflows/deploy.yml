name: Validate and Deploy Surds App

# ─────────────────────────────────────────
# WHEN does this workflow run?
# ─────────────────────────────────────────
on:
  push:
    branches: [ main, dev ]   # Watches BOTH branches

jobs:

  # ═══════════════════════════════════════
  # JOB 1: Always runs — checks your code
  # ═══════════════════════════════════════
  validate:
    runs-on: ubuntu-latest
    steps:

      - name: Get the code
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript syntax..."
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!scriptMatch) { console.error('No script tag found'); process.exit(1); }
            try {
              new Function(scriptMatch[1]);
              console.log('✅ JavaScript syntax is valid');
            } catch(e) {
              console.error('❌ JavaScript error:', e.message);
              process.exit(1);
            }
          "

      - name: Check critical app elements exist
        run: |
          echo "Checking required HTML elements..."
          grep -q "generateTest"   index.html && echo "✅ generateTest function found"   || (echo "❌ generateTest function missing!"   && exit 1)
          grep -q "subtopicGrid"   index.html && echo "✅ subtopicGrid found"            || (echo "❌ subtopicGrid missing!"            && exit 1)
          grep -q "diffSelect"     index.html && echo "✅ Difficulty selector found"     || (echo "❌ Difficulty selector missing!"     && exit 1)
          grep -q "gen-btn"        index.html && echo "✅ Generate button found"         || (echo "❌ Generate button missing!"         && exit 1)
          grep -q "questionsWrap"  index.html && echo "✅ Questions container found"     || (echo "❌ Questions container missing!"     && exit 1)
          echo "✅ All critical elements present"

  # ═══════════════════════════════════════
  # JOB 2: Only runs when pushing to main
  #         AND only if Job 1 passed
  # ═══════════════════════════════════════
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'   # 👈 Only deploys from main, never from dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Get the code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
